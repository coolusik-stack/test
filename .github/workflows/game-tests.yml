# 도토리깡: runs every automated check (angry-fortress/tests) on each push and pull request that
# touches the game, and before any build ships (the release workflows call this one first).
# The run page shows a summary table; screenshots from the run are attached as an artifact.
name: Game tests

on:
  push:
    paths: ['angry-fortress/**', '.github/workflows/game-tests.yml']
  pull_request:
    paths: ['angry-fortress/**', '.github/workflows/game-tests.yml']
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: angry-fortress
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angry-fortress/package-lock.json

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Syntax
        run: for f in js/*.js scripts/*.mjs tests/*.mjs tests/suites/*.mjs; do node --check "$f"; done

      - name: Pre-launch check
        run: npm run preflight

      - name: Tests
        run: npm test

      - name: Summary
        if: always()
        run: cat tests/output/summary.md tests/output/preflight.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Screenshots from the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: angry-fortress/tests/output
          retention-days: 14
