<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>asset maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
  body { margin: 0; background: #222; }
  canvas { display: block; margin: 8px; }
</style>
</head>
<body>
<!-- Renders the PWA icons and the share image from the in-game art. Used by a Playwright script. -->
<canvas id="icon" width="512" height="512"></canvas>
<canvas id="og" width="1200" height="630"></canvas>
<canvas id="appicon" width="1024" height="1024"></canvas>
<canvas id="splash" width="2732" height="2732"></canvas>
<script type="module">
import * as Art from '../js/art.js';

function burst(g, w, h, c1, c2, cx = w / 2, cy = h / 2) {
  const bg = g.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h) * 0.75);
  bg.addColorStop(0, c1);
  bg.addColorStop(1, c2);
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);
  g.save();
  g.translate(cx, cy);
  g.fillStyle = 'rgba(255,255,255,0.13)';
  for (let i = 0; i < 16; i++) {
    g.rotate((Math.PI * 2) / 16);
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(Math.max(w, h), -Math.max(w, h) * 0.1);
    g.lineTo(Math.max(w, h), Math.max(w, h) * 0.1);
    g.closePath();
    if (i % 2 === 0) g.fill();
  }
  g.restore();
}

function drawIcon(maskable, id = 'icon') {
  const c = document.getElementById(id);
  const g = c.getContext('2d');
  const S = c.width;
  g.clearRect(0, 0, S, S);
  burst(g, S, S, '#9fe3ff', '#2a86d6');
  // captain on cart with slingshot, centred
  g.save();
  const k = maskable ? S / 5.2 : S / 4.3;
  g.translate(S / 2, S * 0.56);
  g.scale(k, k);
  Art.drawCommander(g, -0.25, 0.45, { team: 0, facing: 1, time: 0.4, blink: 0, hurt: 0, hp: 1, moving: false, wheelAngle: 0.3, dead: false, pouch: null, aimPower: 0, mood: 'aim' }, (ctx) => {
    const a = Art.slingAnchors(-0.25, 0.45, 1);
    Art.drawNut(ctx, 'acorn', a.rest.x, a.rest.y - 0.13, 0.38, 0, { time: 0.2, state: 'fly', lookX: 1, lookY: 0 });
  });
  g.restore();
  return c;
}

function drawOG() {
  const c = document.getElementById('og');
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#4fb0f2');
  sky.addColorStop(0.6, '#a7e0ff');
  sky.addColorStop(1, '#e8f8ff');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);
  // sun + clouds
  g.fillStyle = 'rgba(255,245,200,0.5)';
  g.beginPath(); g.arc(W * 0.86, H * 0.2, 90, 0, 7); g.fill();
  g.fillStyle = '#fff6c9';
  g.beginPath(); g.arc(W * 0.86, H * 0.2, 52, 0, 7); g.fill();
  const cloud = (x, y, s) => {
    g.fillStyle = 'rgba(255,255,255,0.95)';
    for (const [dx, dy, r] of [[-1.1, 0, 0.9], [0, -0.5, 1.25], [1.1, 0, 0.95], [0.4, 0.2, 0.9], [-0.5, 0.25, 0.8]]) {
      g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); g.fill();
    }
  };
  cloud(170, 110, 34); cloud(640, 70, 26); cloud(1010, 330, 30);
  // far forest line: soft round crowns with a few pines
  const crowns = (base, col, step, rMin, rVar, seed) => {
    g.fillStyle = col;
    g.beginPath(); g.moveTo(0, H);
    for (let x = -20, i = 0; x <= W + 40; x += step, i++) {
      const r = rMin + ((Math.sin(i * 12.9898 + seed) * 43758.5453) % 1 + 1) % 1 * rVar;
      g.moveTo(x + r, base); g.arc(x, base - r * 0.6, r, 0, Math.PI * 2);
    }
    g.fill();
    g.fillRect(0, base - 4, W, H - base + 4);
  };
  crowns(400, '#b9dcc0', 46, 30, 26, 1);
  g.fillStyle = '#a6cfae';
  for (const [x, h] of [[70, 150], [300, 120], [760, 140], [1130, 160]]) {
    g.beginPath(); g.moveTo(x, 330 - h * 0.35); g.lineTo(x - 34, 420); g.lineTo(x + 34, 420); g.closePath(); g.fill();
  }
  crowns(450, '#98c9a0', 58, 34, 30, 7);
  // ground islands
  const ground = (x0, x1, top) => {
    g.fillStyle = '#9a6334';
    g.beginPath();
    g.moveTo(x0 - 40, H);
    g.quadraticCurveTo(x0 - 30, top + 20, x0 + 30, top);
    g.lineTo(x1 - 30, top);
    g.quadraticCurveTo(x1 + 30, top + 20, x1 + 40, H);
    g.fill();
    g.strokeStyle = '#3d9a24'; g.lineWidth = 16; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0 + 10, top + 4); g.lineTo(x1 - 10, top + 4); g.stroke();
    g.strokeStyle = '#6fcb3c'; g.lineWidth = 10;
    g.beginPath(); g.moveTo(x0 + 10, top); g.lineTo(x1 - 10, top); g.stroke();
  };
  const HZ = 36;
  const home = (x, y, team, facing) => { g.save(); g.translate(x, y); g.scale(HZ, HZ); Art.drawHomeTree(g, { x: 0, y: 0, team, facing, time: 0.4, seed: 3 + team }); g.restore(); };
  home(62, 520, 0, 1);
  home(1150, 505, 1, -1);
  ground(-60, 360, 520);
  ground(860, 1260, 505);
  // the cloud sea under the islands
  g.fillStyle = '#ffffff';
  for (let x = -20; x < W + 60; x += 70) { g.beginPath(); g.arc(x, 600 + Math.sin(x * 0.05) * 8, 46 + (x % 3) * 6, 0, 7); g.fill(); }
  g.fillRect(0, 600, W, 40);
  const Z = 62;
  const world = (x, y, fn) => { g.save(); g.translate(x, y); g.scale(Z, Z); fn(); g.restore(); };
  // captains
  world(150, 520 - 0.75 * Z, () => {
    Art.drawCommander(g, 0, 0, { team: 0, facing: 1, time: 0.3, hp: 1, mood: 'aim', pouch: null }, (ctx) => {
      const a = Art.slingAnchors(0, 0, 1);
      Art.drawNut(ctx, 'acorn', a.rest.x, a.rest.y - 0.13, 0.38, 0, { state: 'fly', lookX: 1 });
    });
  });
  world(1060, 505 - 0.75 * Z, () => {
    Art.drawCommander(g, 0, 0, { team: 1, facing: -1, time: 1.1, hp: 1, mood: 'scared' });
  });
  // the 깡단: one on each hat, one running behind each cart
  if (Art.drawCrew) {
    world(150, 520 - 0.75 * Z, () => {
      Art.drawCrew(g, -1.3, 0.75, { team: 0, variant: 1, facing: 1, pose: 'cheer', t: 0.25, time: 0.4 });
      Art.drawCrew(g, -0.08, -1.46, { team: 0, variant: 0, facing: 1, pose: 'shout', t: 0.3, time: 0.4 });
    });
    world(1060, 505 - 0.75 * Z, () => {
      Art.drawCrew(g, 1.3, 0.75, { team: 1, variant: 1, facing: -1, pose: 'scared', t: 0.3, time: 0.9 });
      Art.drawCrew(g, 0.08, -1.46, { team: 1, variant: 0, facing: -1, pose: 'sit', t: 0.3, time: 0.9 });
    });
  }
  // forts
  const block = (x, y, m, w, h, a = 0, shape = 'box', r = 0) => world(x, y, () => Art.drawBlock(g, { material: m, shape, x: 0, y: 0, angle: a, w, h, r, hp01: 1, seed: (x * 7 + y) | 0 }));
  block(900, 505 - 62, 'wood', 0.26, 2.0);
  block(1000, 505 - 62, 'wood', 0.26, 2.0);
  block(950, 505 - 132, 'wood', 2.1, 0.26, 0.08);
  block(950, 505 - 22, 'stone', 0.7, 0.7);
  block(915, 505 - 160, 'leaf', 0.7, 0.7, 0.3);
  block(1150, 505 - 22, 'hive', 0.7, 0.7);
  block(240, 520 - 20, 'mushroom', 0.6, 0.6);
  block(280, 520 - 25, 'stone', 0.8, 0.8);
  block(330, 520 - 75, 'log', 0.3, 1.6, -0.1);
  block(985, 505 - 166, 'crate', 0.76, 0.6, 0.06);
  // flying birds with puff trails
  const trail = (pts) => {
    g.fillStyle = 'rgba(255,255,255,0.85)';
    pts.forEach(([x, y], i) => { g.beginPath(); g.arc(x, y, i % 3 === 0 ? 7 : 4, 0, 7); g.fill(); });
  };
  const arc = [];
  for (let t = 0; t <= 1; t += 0.03) arc.push([230 + t * 620, 420 - Math.sin(t * Math.PI) * 110 - t * 20]);
  trail(arc);
  world(860, 395, () => Art.drawNut(g, 'burr', 0, 0, 0.42, 0.45, { state: 'fly', fuse: 0.8, time: 0.3 }));
  world(600, 330, () => Art.drawNut(g, 'pinenut', 0, 0, 0.36, -0.05, { state: 'fly', time: 0.5 }));
  world(420, 345, () => Art.drawNut(g, 'kernel', 0, 0, 0.24, -0.2, { state: 'fly', time: 0.9 }));
  world(385, 385, () => Art.drawNut(g, 'kernel', 0, 0, 0.22, -0.1, { state: 'fly', time: 0.9 }));
  world(455, 392, () => Art.drawNut(g, 'kernel', 0, 0, 0.22, 0.1, { state: 'fly', time: 0.9 }));
  world(1085, 215, () => Art.drawNut(g, 'walnut', 0, 0, 0.42, 0, { state: 'fly', time: 0.2, flip: true, pound: true }));
  // logo
  g.save();
  g.translate(W / 2, 128);
  g.rotate(-0.05);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.font = '76px "Black Han Sans"';
  g.lineWidth = 18; g.strokeStyle = '#2b1a12';
  g.strokeText('도토리', -95, -70);
  g.fillStyle = '#ffd21f';
  g.fillText('도토리', -95, -70);
  g.font = '190px "Black Han Sans"';
  g.lineWidth = 36;
  g.strokeText('깡!', 40, 40);
  g.fillStyle = '#2b1a12';
  g.fillText('깡!', 40, 52);
  const tg = g.createLinearGradient(0, -40, 0, 110);
  tg.addColorStop(0, '#fff2a8');
  tg.addColorStop(0.4, '#ffc53a');
  tg.addColorStop(0.65, '#ff8a26');
  tg.addColorStop(1, '#e2461d');
  g.fillStyle = tg;
  g.fillText('깡!', 40, 40);
  g.restore();
  g.save();
  g.font = '30px Jua';
  const tag = '작아도 깡! 친구랑 각자 폰으로 1:1 도토리 새총 대결';
  const tw = g.measureText(tag).width + 48;
  g.translate(W / 2, 300);
  g.rotate(0.02);
  g.fillStyle = '#2b1a12';
  g.beginPath(); g.roundRect(-tw / 2, -26, tw, 52, 26); g.fill();
  g.fillStyle = '#fff4dc';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(tag, 0, 2);
  g.restore();
  return c;
}

// iOS launch screen: shown aspect-filled, so a landscape phone only sees the middle band
function drawSplash() {
  const c = document.getElementById('splash');
  const g = c.getContext('2d');
  const S = c.width;
  const sky = g.createLinearGradient(0, 0, 0, S);
  sky.addColorStop(0, '#58b7f5');
  sky.addColorStop(1, '#bfe8ff');
  g.fillStyle = sky;
  g.fillRect(0, 0, S, S);
  g.save();
  g.translate(S / 2, S / 2);
  g.rotate(-0.05);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.font = '170px "Black Han Sans"';
  g.lineWidth = 30; g.strokeStyle = '#2b1a12';
  g.strokeText('도토리', -110, -210);
  g.fillStyle = '#ffd21f';
  g.fillText('도토리', -110, -210);
  g.font = '420px "Black Han Sans"';
  g.lineWidth = 80;
  g.strokeText('깡!', 60, 60);
  g.fillStyle = '#2b1a12';
  g.fillText('깡!', 60, 88);
  const tg = g.createLinearGradient(0, -120, 0, 240);
  tg.addColorStop(0, '#fff2a8');
  tg.addColorStop(0.4, '#ffc53a');
  tg.addColorStop(0.65, '#ff8a26');
  tg.addColorStop(1, '#e2461d');
  g.fillStyle = tg;
  g.fillText('깡!', 60, 60);
  g.restore();
  // the two captains face off under the title (inside the band a landscape phone shows)
  const cap = (x, team, facing) => {
    g.save();
    g.translate(x, S / 2 + 520);
    g.scale(170, 170);
    Art.drawCommander(g, 0, 0, { team, facing, time: 0.4 + team, hp: 1, mood: 'aim', pouch: null });
    if (Art.drawCrew) {
      Art.drawCrew(g, -facing * 1.3, 0.75, { team, variant: 1, facing, pose: 'cheer', t: 0.25, time: 0.4 + team });
      Art.drawCrew(g, -facing * 0.08, -1.46, { team, variant: 0, facing, pose: 'sit', t: 0.3, time: 0.4 + team });
    }
    g.restore();
  };
  cap(S / 2 - 620, 0, 1);
  cap(S / 2 + 620, 1, -1);
  return c;
}

window.makeAssets = async () => {
  await document.fonts.load('150px "Black Han Sans"', '도토리깡!');
  await document.fonts.load('30px Jua', '작아도 깡! 친구랑 각자 폰으로 1:1 도토리 새총 대결');
  const out = {};
  const ic = document.getElementById('icon');
  drawIcon(false);
  out.icon512 = ic.toDataURL('image/png');
  const small = document.createElement('canvas');
  small.width = small.height = 192;
  small.getContext('2d').drawImage(ic, 0, 0, 192, 192);
  out.icon192 = small.toDataURL('image/png');
  drawIcon(true);
  out.maskable = ic.toDataURL('image/png');
  drawIcon(false);
  drawOG();
  out.og = document.getElementById('og').toDataURL('image/jpeg', 0.88);
  // App Store icon: 1024², full bleed (iOS rounds the corners), raw pixels so it can be saved without alpha
  const ai = drawIcon(false, 'appicon');
  out.appicon = { w: ai.width, h: ai.height, rgba: Array.from(ai.getContext('2d').getImageData(0, 0, ai.width, ai.height).data) };
  out.splash = drawSplash().toDataURL('image/png');
  return out;
};
window.assetsReady = true;
</script>
</body>
</html>
