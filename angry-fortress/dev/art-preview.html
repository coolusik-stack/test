<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Preview — 도토리깡</title>
<style>
  html, body { margin: 0; background: #7cc4f2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#c { display: block; }
  #icons { display: flex; gap: 14px; align-items: center; padding: 14px 24px 28px; background: linear-gradient(#e9f6ff, #cfeaff); }
  #icons .ic { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #234; }
  #icons canvas { width: 96px; height: 96px; border-radius: 22px; background: radial-gradient(circle at 40% 35%, #ffffff, #bfe3ff); box-shadow: 0 2px 6px rgba(0,40,80,.25); }
  #icons canvas.dark { background: radial-gradient(circle at 40% 35%, #3a4b66, #1a2233); }
  #bar { position: fixed; top: 8px; right: 12px; z-index: 5; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<div id="bar"><label><input type="checkbox" id="anim"> animate</label></div>
<canvas id="c"></canvas>
<div id="icons"></div>
<script type="module">
import * as A from '../js/art.js';

window.__errors = [];
window.addEventListener('error', e => window.__errors.push(String(e.message)));

const params = new URLSearchParams(location.search);
const W = 1900, H = 7560;
const dpr = window.devicePixelRatio || 1;
const cv = document.getElementById('c');
cv.width = W * dpr; cv.height = H * dpr;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
const ctx = cv.getContext('2d');

function at(px, py, k, fn) {
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * px, dpr * py);
  fn();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function label(t, x, y, size = 13, color = '#10324f', align = 'center') {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `600 ${size}px system-ui, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}
function title(t, y) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(0, y - 20, W, 40);
  label(t, 24, y, 22, '#0c2a44', 'left');
}
function background() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#5fb6f0'); g.addColorStop(0.35, '#a9dcfb'); g.addColorStop(0.6, '#d7f0ff'); g.addColorStop(1, '#f3fbff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (const [x, y, s] of [[260, 120, 1], [1300, 90, 1.3], [900, 1500, 1.1], [1600, 2300, 0.9], [300, 2900, 1.2]]) {
    for (const [dx, dy, r] of [[0, 0, 40], [45, -18, 50], [95, 0, 38], [40, 16, 36]]) {
      ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); ctx.fill();
    }
  }
}

const TYPES = ['acorn', 'pinenut', 'peanut', 'burr', 'walnut', 'kernel'];
const RAD = { acorn: 0.38, pinenut: 0.34, peanut: 0.34, burr: 0.40, walnut: 0.40, kernel: 0.22 };
const STATES = [
  ['idle', {}],
  ['fly', { state: 'fly', lookX: 1, lookY: -0.2 }],
  ['hurt', { state: 'hurt' }],
  ['dizzy', { state: 'dizzy' }],
  ['blink .5', { blink: 0.5 }],
  ['blink 1', { blink: 1 }],
  ['flip', { flip: true, lookX: -1 }],
  ['fly flip', { flip: true, state: 'fly', lookX: -1 }],
  ['squash +.3', { squash: 0.3 }],
  ['squash -.3', { squash: -0.3 }],
  ['look ↖', { lookX: -0.8, lookY: -0.7 }],
  ['rot 40°', { angle: 0.7 }],
  ['fuse .4 / pound', { fuse: 0.4, pound: true, state: 'fly' }],
  ['fuse 1 / pound', { fuse: 1, pound: true }],
];

function drawAll(time) {
  background();
  let y0 = 40;
  title('Nut ammo — states (110 px/m; acorn .38, pinenut .34, peanut .34, burr .40, walnut .40, kernel .22 m)', y0);
  const cellW = 128, cellH = 128, gx0 = 150;
  STATES.forEach(([name], i) => label(name, gx0 + i * cellW, y0 + 40));
  TYPES.forEach((t, row) => {
    const cy = y0 + 115 + row * cellH;
    label(t, 60, cy, 15);
    STATES.forEach(([name, st], i) => {
      const s = Object.assign({ time: time + i * 0.37 + row * 0.11, blink: 0, state: 'idle' }, st);
      at(gx0 + i * cellW, cy, 110, () => A.drawNut(ctx, t, 0, 0, RAD[t], st.angle || 0, s));
    });
  });
  y0 += 115 + TYPES.length * cellH;

  title('Small (≈12 px radius) and large (≈80 px radius) sizes', y0);
  TYPES.forEach((t, i) => {
    at(90 + i * 62, y0 + 70, 12 / RAD[t] * 1.0, () => A.drawNut(ctx, t, 0, 0, RAD[t], 0, { time }));
    at(90 + i * 62, y0 + 120, 12 / RAD[t] * 1.0, () => A.drawNut(ctx, t, 0, 0, RAD[t], 0, { time, state: 'fly', lookX: 1 }));
  });
  const big = [['acorn', {}], ['pinenut', {}], ['peanut', {}], ['burr', { fuse: 0 }], ['burr', { fuse: 0.9, state: 'fly' }], ['walnut', {}], ['walnut', { pound: true }]];
  big.forEach((b, i) => at(560 + i * 190, y0 + 130, 80 / RAD[b[0]], () => A.drawNut(ctx, b[0], 0, 0, RAD[b[0]], 0, Object.assign({ time }, b[1]))));
  y0 += 270;

  title('Commanders (80 px/m) — CART circle r .75 and head circle r .55 shown dashed', y0);
  const cmds = [
    ['T0 rest →', { team: 0, facing: 1 }],
    ['T0 rest ←', { team: 0, facing: -1 }],
    ['T1 rest →', { team: 1, facing: 1 }],
    ['T1 rest ←', { team: 1, facing: -1 }],
    ['T0 aim + acorn', { team: 0, facing: 1, mood: 'aim', aimPower: 0.85, pouch: 'pull' }],
    ['T1 aim + peanut ←', { team: 1, facing: -1, mood: 'aim', aimPower: 0.6, pouch: 'pull2' }],
    ['T0 loaded rest', { team: 0, facing: 1, ammo: 'pinenut' }],
    ['T1 loaded rest', { team: 1, facing: 1, ammo: 'burr' }],
    ['T0 hurt', { team: 0, facing: 1, hurt: 0.9 }],
    ['T1 hurt', { team: 1, facing: 1, hurt: 0.9 }],
    ['T0 hp .3', { team: 0, facing: 1, hp: 0.3 }],
    ['T1 hp .1', { team: 1, facing: -1, hp: 0.1 }],
    ['T0 dead', { team: 0, facing: 1, dead: true, hp: 0 }],
    ['T1 dead', { team: 1, facing: -1, dead: true, hp: 0 }],
    ['T0 happy', { team: 0, facing: 1, mood: 'happy' }],
    ['T1 scared', { team: 1, facing: 1, mood: 'scared' }],
    ['T0 moving', { team: 0, facing: 1, moving: true }],
    ['T1 blink', { team: 1, facing: 1, blink: 1 }],
  ];
  const cw = 230, ch = 290, perRow = 8;
  cmds.forEach(([name, st], i) => {
    const col = i % perRow, row = Math.floor(i / perRow);
    const cx = 130 + col * cw, cy = y0 + 210 + row * ch;
    label(name, cx, cy + 92);
    at(cx, cy, 80, () => {
      ctx.fillStyle = 'rgba(110,170,60,0.55)';
      ctx.fillRect(-1.4, 0.75, 2.8, 0.1);
      ctx.save(); ctx.setLineDash([0.06, 0.06]); ctx.strokeStyle = 'rgba(0,60,120,0.35)'; ctx.lineWidth = 0.02;
      ctx.beginPath(); ctx.arc(0, 0, A.CART.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -0.75, 0.55, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      const s = Object.assign({ time: time + i * 0.21, blink: 0, hp: 1, hurt: 0, wheelAngle: time * 3 }, st);
      const an = A.slingAnchors(0, 0, s.facing);
      let ammo = null;
      if (st.pouch === 'pull') { s.pouch = { x: an.rest.x - 1.25, y: an.rest.y + 0.45 }; ammo = 'acorn'; }
      else if (st.pouch === 'pull2') { s.pouch = { x: an.rest.x + 0.9, y: an.rest.y + 0.25 }; ammo = 'peanut'; }
      else s.pouch = null;
      if (st.ammo) ammo = st.ammo;
      const p = s.pouch || an.rest;
      A.drawCommander(ctx, 0, 0, s, ammo ? (c) => A.drawNut(c, ammo, p.x, p.y, RAD[ammo], 0, { time, flip: s.facing < 0, lookX: s.facing }) : null);
      if (i < 2) {
        for (const k of ['back', 'front', 'rest']) {
          ctx.fillStyle = k === 'rest' ? '#00c853' : '#ff00aa';
          ctx.beginPath(); ctx.arc(an[k].x, an[k].y, 0.03, 0, Math.PI * 2); ctx.fill();
        }
      }
    });
  });
  y0 += 210 + Math.ceil(cmds.length / perRow) * ch;

  title('Blocks — rows: wood / stone / leaf / hive / mushroom / crate / log · cols: box hp 1 / .5 / .2 · circle hp 1 / .5 / .2 · small · rotated (70 px/m)', y0);
  const mats = ['wood', 'stone', 'leaf', 'hive', 'mushroom', 'crate', 'log'];
  const hps = [1, 0.5, 0.2];
  mats.forEach((m, mi) => {
    const cy = y0 + 85 + mi * 118;
    label(m, 50, cy, 15);
    const bw = m === 'crate' ? 0.75 : m === 'log' ? 2.0 : 1.4, bh = m === 'crate' ? 0.6 : m === 'log' ? 0.55 : 0.6;
    hps.forEach((hp, hi) => {
      at(190 + hi * 205, cy, 70, () => A.drawBlock(ctx, { material: m, shape: 'box', x: 0, y: 0, angle: 0, w: bw, h: bh, hp01: hp, seed: 3 + mi * 2 + hi }));
      at(820 + hi * 120, cy, 70, () => A.drawBlock(ctx, { material: m, shape: 'circle', x: 0, y: 0, angle: time * 0.2, r: m === 'log' ? 0.55 : 0.45, hp01: hp, seed: 5 + mi }));
    });
    at(1230, cy, 70, () => A.drawBlock(ctx, { material: m, shape: 'box', x: 0, y: 0, w: 0.3, h: 0.3, hp01: 1, seed: 9 + mi }));
    at(1380, cy, 70, () => A.drawBlock(ctx, { material: m, shape: 'box', x: 0, y: 0, angle: 0.4, w: 0.75, h: 0.75, hp01: 0.5, seed: 11 + mi }));
    at(1600, cy, 70, () => A.drawBlock(ctx, { material: m, shape: 'box', x: 0, y: 0, angle: 0, w: bw, h: bh, hp01: 1, seed: 21 + mi, flash: 0.8 }));
    at(1810, cy, 70, () => A.drawBlock(ctx, { material: m, shape: 'box', x: 0, y: 0, angle: 0, w: bh, h: bw, hp01: 1, seed: 31 + mi }));
  });
  label('col 8: flash .8 · col 9: vertical', 1700, y0 + 40, 12);
  y0 += 85 + mats.length * 118;
  const rowY = y0 + 20;
  label('long/big: 3 m leaf bundles (green / autumn), 2.6 m log, stale "ice" → leaf, crates, 2.4 m blocks', 24, rowY, 14, '#10324f', 'left');
  at(40, rowY + 50, 70, () => {
    const L = [
      { material: 'leaf', shape: 'box', x: 1.8, y: 0.3, w: 3, h: 0.35, hp01: 1, seed: 2 },
      { material: 'leaf', shape: 'box', x: 1.8, y: 1.0, w: 3, h: 0.35, hp01: 0.4, seed: 4 },
      { material: 'ice', shape: 'box', x: 1.8, y: 1.7, w: 3, h: 0.35, hp01: 1, seed: 7 },
      { material: 'log', shape: 'box', x: 5.2, y: 0.4, w: 2.6, h: 0.6, hp01: 1, seed: 1 },
      { material: 'log', shape: 'box', x: 5.2, y: 1.3, w: 1.6, h: 0.5, hp01: 0.2, seed: 2 },
      { material: 'log', shape: 'box', x: 7.3, y: 1.0, w: 0.55, h: 2.0, hp01: 1, seed: 3 },
      { material: 'crate', shape: 'box', x: 8.6, y: 0.4, w: 0.75, h: 0.6, hp01: 1, seed: 1 },
      { material: 'crate', shape: 'box', x: 8.6, y: 1.4, w: 0.75, h: 0.6, hp01: 1, seed: 2, angle: -0.3 },
      { material: 'crate', shape: 'box', x: 9.9, y: 0.7, w: 1.1, h: 0.9, hp01: 0.3, seed: 3 },
      { material: 'leaf', shape: 'circle', x: 11.4, y: 0.6, r: 0.6, hp01: 1, seed: 1 },
      { material: 'leaf', shape: 'circle', x: 11.4, y: 1.9, r: 0.5, hp01: 0.3, seed: 2 },
      { material: 'log', shape: 'circle', x: 12.9, y: 0.7, r: 0.6, hp01: 1, seed: 5 },
      { material: 'log', shape: 'circle', x: 12.9, y: 2.0, r: 0.4, hp01: 0.3, seed: 6 },
      { material: 'leaf', shape: 'box', x: 15.3, y: 1.2, w: 2.4, h: 2.4, hp01: 0.5, seed: 8 },
      { material: 'log', shape: 'box', x: 18.2, y: 1.2, w: 2.4, h: 0.6, hp01: 0.6, seed: 9, angle: 0.3 },
      { material: 'wood', shape: 'box', x: 21.0, y: 1.2, w: 2.4, h: 2.4, hp01: 0.5, seed: 18 },
    ];
    for (const b of L) A.drawBlock(ctx, b);
  });
  y0 += 270;

  title('Trees (26 px/m) — oak / maple / pine / chestnut. Row 1: nuts 6 + anchors (pink = branch, cyan = web) with hive & web. Row 2: nuts 3, shake .9. Row 3: nuts 0, hp .3', y0);
  const kinds = ['oak', 'maple', 'pine', 'chestnut'];
  const rowsT = [{ nuts: 6, shake: 0, hp01: 1, deco: true }, { nuts: 3, shake: 0.9, hp01: 1 }, { nuts: 0, shake: 0, hp01: 0.3 }];
  rowsT.forEach((rw, ri) => {
    kinds.forEach((k, ki) => {
      const gx = 180 + ki * 440, gyp = y0 + 260 + ri * 290;
      at(gx, gyp, 26, () => {
        ctx.fillStyle = 'rgba(90,160,60,0.6)'; ctx.fillRect(-4, 0, 8, 0.3);
        const t = { x: 0, y: 0, h: [4.2, 3.8, 4.6, 4.0][ki], canopyR: [2.3, 2.1, 2.2, 2.4][ki], kind: k, nuts: rw.nuts, shake: rw.shake, time: time + ki, hp01: rw.hp01, seed: 3 + ki + ri * 5 };
        A.drawTree(ctx, t);
        const an = A.treeAnchors(t);
        if (rw.deco) {
          const top = { x: an.branch.x, y: an.branch.y };
          ctx.strokeStyle = '#c8a878'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(top.x, top.y + 0.7); ctx.stroke();
          A.drawBlock(ctx, { material: 'hive', shape: 'box', x: top.x, y: top.y + 1.05, w: 0.6, h: 0.7, seed: 4 });
          const trunkX = an.web.x - (an.branch.x > 0 ? 1.3 : -1.3);
          A.drawWeb(ctx, { x: an.web.x + (an.branch.x > 0 ? 0.25 : -0.25), y: an.web.y + 0.2, r: 0.8, anchors: [{ x: trunkX + (an.branch.x > 0 ? 0.3 : -0.3), y: an.web.y - 0.3 }, { x: an.web.x + (an.branch.x > 0 ? 0.6 : -0.6), y: an.branch.y + 0.15 }, { x: an.web.x + (an.branch.x > 0 ? 0.6 : -0.6), y: -0.02 }], time, seed: ki });
        }
        for (const [p, c] of [[an.branch, '#ff00aa'], [an.web, '#00c8ff']]) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(p.x, p.y, 0.1, 0, Math.PI * 2); ctx.fill(); }
      });
      if (ri === 0) label(k, gx, y0 + 40, 14);
    });
  });
  y0 += 260 + 3 * 290 - 150;

  title('Fallen trees (len 4.5) and stumps (40 px/m)', y0);
  kinds.forEach((k, ki) => {
    at(160 + ki * 450, y0 + 100, 40, () => A.drawFallenTree(ctx, { x: 0, y: 0, angle: ki === 1 ? -0.25 : ki === 3 ? 0.15 : 0, len: 4.5, kind: k, seed: ki }));
    at(160 + ki * 450, y0 + 210, 40, () => { ctx.fillStyle = 'rgba(90,160,60,0.6)'; ctx.fillRect(-2, 0, 4, 0.25); A.drawStump(ctx, { x: 0, y: 0, w: 0.9, h: 0.6, kind: k, seed: ki }); A.drawStump(ctx, { x: 2.0, y: 0, w: 0.7, h: 0.9, kind: k, seed: ki + 7 }); });
  });
  y0 += 260;

  title('Spider webs (intact / wobble / broken .5 / broken 1) and dandelions (blown 0 / .4 / .8 / 1) — 70 px/m', y0);
  const webs = [{ broken: 0, wobble: 0 }, { broken: 0, wobble: 0.8 }, { broken: 0.5, wobble: 0.2 }, { broken: 1, wobble: 0 }];
  webs.forEach((wb, i) => {
    at(120 + i * 230, y0 + 150, 70, () => A.drawWeb(ctx, Object.assign({ x: 0, y: 0, r: 1.0, anchors: [{ x: -1.3, y: -1.25 }, { x: 1.35, y: -1.1 }, { x: 0.2, y: 1.4 }], time: time + i, seed: 3 }, wb)));
  });
  [0, 0.4, 0.8, 1].forEach((bl, i) => {
    at(1050 + i * 220, y0 + 250, 110, () => { ctx.fillStyle = 'rgba(90,160,60,0.6)'; ctx.fillRect(-0.9, 0, 1.8, 0.12); A.drawDandelion(ctx, { x: 0, y: 0, h: 1.1, headR: 0.45, blown: bl, time: time + i, seed: i }); });
  });
  y0 += 330;

  title('Home trees (22 px/m) — team 0 oak facing →, team 1 pine facing ←; terrain drawn over, commanders in front', y0);
  at(0, y0 + 20, 22, () => {
    const gy = 14.5;
    A.drawHomeTree(ctx, { x: 12, y: gy, team: 0, facing: 1, time, seed: 1 });
    A.drawHomeTree(ctx, { x: 60, y: gy, team: 1, facing: -1, time, seed: 2 });
    A.drawHomeTree(ctx, { x: 36, y: gy, team: 0, facing: -1, time, seed: 3 });
    const g = ctx.createLinearGradient(0, gy, 0, gy + 4);
    g.addColorStop(0, '#79c24a'); g.addColorStop(0.1, '#4f9a33'); g.addColorStop(0.16, '#8b5e34'); g.addColorStop(1, '#5e3c1f');
    ctx.fillStyle = g; ctx.fillRect(0, gy, 90, 4);
    A.drawCommander(ctx, 15.5, gy - 0.75, { team: 0, facing: 1, time }, null);
    A.drawCommander(ctx, 56.5, gy - 0.75, { team: 1, facing: -1, time }, null);
  });
  y0 += 420;

  title('Forest war mock scene (40 px/m)', y0);
  const sceneTop = y0 + 30;
  at(0, sceneTop, 40, () => {
    const gy = 12.5;
    A.drawHomeTree(ctx, { x: 2.2, y: gy, team: 0, facing: 1, time, seed: 1 });
    A.drawHomeTree(ctx, { x: 45.3, y: gy, team: 1, facing: -1, time, seed: 2 });
    const g = ctx.createLinearGradient(0, gy, 0, gy + 3);
    g.addColorStop(0, '#79c24a'); g.addColorStop(0.15, '#4f9a33'); g.addColorStop(0.2, '#8b5e34'); g.addColorStop(1, '#5e3c1f');
    ctx.fillStyle = g; ctx.fillRect(0, gy, 48, 3);
    const t1 = { x: 16, y: gy, h: 4.4, canopyR: 2.3, kind: 'oak', nuts: 4, shake: 0, time, seed: 2 };
    const t2 = { x: 32.5, y: gy, h: 4.8, canopyR: 2.2, kind: 'pine', nuts: 3, shake: 0.5, time, seed: 3 };
    A.drawTree(ctx, t1); A.drawTree(ctx, t2);
    const a1 = A.treeAnchors(t1);
    ctx.strokeStyle = '#c8a878'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(a1.branch.x, a1.branch.y); ctx.lineTo(a1.branch.x, a1.branch.y + 0.6); ctx.stroke();
    A.drawBlock(ctx, { material: 'hive', shape: 'box', x: a1.branch.x, y: a1.branch.y + 0.95, w: 0.6, h: 0.7, seed: 4 });
    const a2 = A.treeAnchors(t2);
    A.drawWeb(ctx, { x: a2.web.x, y: a2.web.y, r: 0.9, anchors: [{ x: 32.5 + (a2.web.x > 32.5 ? 0.3 : -0.3), y: a2.web.y - 0.4 }, { x: a2.branch.x - (a2.web.x > 32.5 ? 0.4 : -0.4), y: a2.branch.y + 0.1 }, { x: a2.web.x, y: gy }], time, seed: 5 });
    A.drawStump(ctx, { x: 21.5, y: gy, w: 0.9, h: 0.6, kind: 'oak', seed: 2 });
    A.drawFallenTree(ctx, { x: 26.5, y: gy - 0.35, angle: 0, len: 4, kind: 'maple', seed: 1 });
    for (const [x, bl] of [[11, 0], [12.2, 0.6], [38.8, 0]]) A.drawDandelion(ctx, { x, y: gy, h: 1.1, headR: 0.45, blown: bl, time, seed: x | 0 });
    const blocks = [
      { material: 'log', shape: 'box', x: 29.3, y: gy - 0.28, w: 2.6, h: 0.55, seed: 3 },
      { material: 'stone', shape: 'box', x: 28.5, y: gy - 1.05, w: 0.5, h: 1.0, seed: 4 },
      { material: 'wood', shape: 'box', x: 30.2, y: gy - 1.05, w: 0.35, h: 1.0, seed: 6 },
      { material: 'leaf', shape: 'box', x: 29.4, y: gy - 1.75, w: 2.4, h: 0.4, seed: 7 },
      { material: 'crate', shape: 'box', x: 29.4, y: gy - 2.25, w: 0.75, h: 0.6, seed: 1 },
      { material: 'mushroom', shape: 'box', x: 35.8, y: gy - 0.45, w: 1.0, h: 0.9, seed: 2 },
      { material: 'leaf', shape: 'circle', x: 24.2, y: gy - 0.5, r: 0.5, seed: 1 },
      { material: 'log', shape: 'circle', x: 37.4, y: gy - 0.5, r: 0.5, seed: 8, hp01: 0.5 },
    ];
    for (const b of blocks) A.drawBlock(ctx, b);
    const s0 = { team: 0, facing: 1, time, mood: 'aim', aimPower: 0.6, hp: 1 };
    const an0 = A.slingAnchors(5.5, gy - 0.75, 1);
    s0.pouch = { x: an0.rest.x - 0.9, y: an0.rest.y + 0.1 };
