<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>ONEKI Brand Book — Keep Calm. Go Crazy.</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="nsk.css">
<style>
@page{size:1836px 1170px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#777}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact;word-break:keep-all;overflow-wrap:break-word}
:root{--ink:#1C1B1D;--dark:#231F20;--black:#0C0C0D;--gold:#B39A5C;--blue:#2743B0;--blue2:#6F8BFF;--pink:#F4ACA4;--grey:#D9D9D9;
--sans:'Hanken Grotesk','Pretendard',sans-serif;--kr:'Pretendard','Hanken Grotesk',sans-serif;--serif:'Newsreader','Noto Serif KR',serif;--krs:'Noto Serif KR','Newsreader',serif;--hand:'Londrina Solid','Pretendard',sans-serif}
.sp{width:1836px;height:1170px;position:relative;overflow:hidden;background:#fff;color:var(--ink);page-break-after:always;break-after:page}
.sp>*{position:absolute}
.full{left:0;top:0;width:100%;height:100%;object-fit:cover}
.pic{object-fit:cover;display:block}
.rh{top:78px;width:918px;text-align:center;font:700 10.5px/1 var(--sans);letter-spacing:.04em}
.rh.r{left:918px}.rh.l{left:0}
.fol{top:1078px;width:918px;text-align:center;font:600 10px/1 var(--sans);letter-spacing:.06em;opacity:.8}
.fol.r{left:918px}.fol.l{left:0}
.h1{font:800 118px/.95 var(--sans);letter-spacing:-.025em}
.h2{font:800 60px/1.02 var(--sans);letter-spacing:-.02em}
.hs{font:600 112px/.98 var(--serif);letter-spacing:-.02em}
.lead{font:700 15.5px/1.55 var(--kr);letter-spacing:-.01em}
.body{font:400 12.8px/1.78 var(--krs);letter-spacing:-.01em}
.body p+p{margin-top:11px}
.q{font:700 12.8px/1.6 var(--kr);margin:0 0 7px}
.a{font:400 12.8px/1.78 var(--krs);margin:0 0 20px;letter-spacing:-.01em}
.a b{font-family:var(--kr);font-weight:700}
.cap{font:700 8.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.gold{color:var(--gold)}.blue{color:var(--blue)}.white{color:#fff}
.mask{-webkit-background-clip:text;background-clip:text;color:transparent;background-size:cover;background-position:center}
.handcaps{font:900 108px/1.02 var(--hand);text-transform:uppercase;text-align:center;letter-spacing:.005em}
.dots{background-image:radial-gradient(circle,#2b2b2e 1.1px,transparent 1.5px);background-size:14px 14px}
.note{font:500 9px/1.5 var(--kr);letter-spacing:.01em;opacity:.7}
</style></head><body>
